name: Checks and preview build
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: dist/
          retention-days: 14
  browsers:
    name: Browser (${{ matrix.project }})
    needs: build
    # Firefox uses Mesa/Xvfb; Safari retains the native macOS graphics stack.
    runs-on: ${{ matrix.runner || 'macos-26' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
            runner: ubuntu-24.04
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: mobile-safari
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install software OpenGL for Firefox
        if: matrix.project == 'firefox'
        run: sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0
      - name: Check Firefox rendering host
        if: matrix.project == 'firefox'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a node scripts/browser-host.mjs
      - name: Test Firefox with a virtual display
        if: matrix.project == 'firefox'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a npm run test:e2e -- --project=firefox --headed
      - run: npm run test:e2e -- --project=${{ matrix.project }}
        if: matrix.project != 'firefox'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
